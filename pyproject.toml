[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physicalevobench-x"
version = "0.1.0"
description = "Auditable marginal robot-experience transfer under matched adaptation budgets"
requires-python = ">=3.10"
dependencies = ["pydantic==2.12.3", "numpy>=2.2.6,<3", "PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
llm = []
sim = [] # Isaac/Arena installed with the pinned upstream container, never from PyPI.

[project.scripts]
pebx = "physicalevobench_x.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
